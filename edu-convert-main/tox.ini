[tox]
envlist = py314
isolated_build = True

[testenv]
description = Тесты и лестница покрытия: чем ближе модуль к бизнес-логике, тем выше порог
extras = dev
# Пороги нельзя задать одним прогоном: coverage читает единственный fail_under
# (coverage/config.py), поэтому сначала снимаем данные один раз, а затем
# спрашиваем отчёт по каждой группе модулей со своим порогом.
commands =
    pytest {posargs} --cov=app --cov-report=
    # A. Ядро нормализации и чтения docx — основа всех расчётов (ТЗ §7.5).
    coverage report --fail-under=95 \
        --include=app/core/normalizer.py,app/core/word_extractor.py
    # B. Тяжёлая генерация и оркестрация: покрыты хуже, но регресс ловить надо.
    coverage report --fail-under=88 \
        --include=app/core/word_generator.py,app/services/orchestrator.py,app/core/excel_parser.py,app/core/differ.py
    # C. Всё, кроме Flet-разметки: её тестами по существу не покрыть. Логика
    #    без отрисовки (persistence) остаётся под порогом, хоть и лежит в ui/.
    coverage report --fail-under=88 \
        --omit=app/ui/components/*,app/ui/main_view.py,app/ui/theme.py,app/ui/clipboard_files.py
    # D. Полная картина, без порога — просто чтобы видеть цифру по проекту.
    coverage report

[testenv:lint]
description = Статический анализ
extras = dev
commands =
    ruff check {posargs:.}
    mypy
