[project]
name = "edu-convert"
version = "0.1.0"
description = "Автоматизированная конвертация РПД и ФОС в целевые шаблоны 2026 (числа из Базы, текст из исходников)."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.34",
    "anyio>=4.13",
    "flet>=0.85",
    "flet-web>=0.85",
    "polars>=1.21",
    "fastexcel>=0.12",
    "xlsxwriter>=3.2",
    "python-docx>=1.2",
    "docxtpl>=0.20",
    "docxcompose>=1.4",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "tox>=4.23",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
educonvert = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# ``tools`` попадает в сборку не «на всякий случай»: orchestrator.py импортирует
# tools.build_templates в рантайме, когда пользователь подсунул неразмеченную
# официальную форму 2026 и её надо разметить на лету.
packages = ["app", "app.core", "app.services", "app.ui", "app.ui.components", "tools"]

[tool.setuptools.package-data]
app = ["templates/*.docx"]

# --------------------------------------------------------------------------- #
#  Тесты и покрытие
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

# --------------------------------------------------------------------------- #
#  Линтер
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = [
    # Проект русскоязычный: 600+ «ёлочек», длинные тире и § в текстах и
    # комментариях — не опечатки и не гомоглифы.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# В тестах assert — основной инструмент, а не забытая отладка.
"tests/*" = ["S101"]

# ``ruff format`` намеренно не подключён: в разметке Flet и в таблицах
# соответствий колонок выравнивание расставлено руками и читается лучше
# автоформата.

[tool.coverage.run]
source = ["app"]
relative_files = true

[tool.coverage.report]
show_missing = true
# Порогов несколько (см. tox.ini): coverage умеет только один fail_under на
# прогон, поэтому пороги задаются флагами отдельных вызовов `coverage report`,
# а не здесь.
exclude_also = [
    "^\\s*\\.\\.\\.$",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Windows-only ветка: на Linux, где гоняются тесты и CI, не исполняется.
    "class WordComConverter",
]
