[tox]
envlist = py314
isolated_build = True

[testenv]
description = Запуск тестов с проверкой покрытия ключевых модулей core/ (≥95%)
deps =
    -r requirements.txt
commands =
    pytest {posargs} \
        --cov=app.core.normalizer \
        --cov=app.core.word_extractor \
        --cov-report=term-missing \
        --cov-fail-under=95
